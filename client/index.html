<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>wORTbomb</title>
<meta name="description" content="wORTbomb: pasá la bomba escribiendo palabras en español antes de que explote. Juego online por salas.">
<meta name="theme-color" content="#2a1f3d">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script>
  // Tema antes de pintar (sin parpadeo).
  try { const t = localStorage.getItem('wortbomb.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<div id="app" aria-live="off"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="announcer" class="sr-only" aria-live="assertive"></div>
<noscript>wORTbomb necesita JavaScript para funcionar.</noscript>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
